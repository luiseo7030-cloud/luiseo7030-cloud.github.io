<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Publications</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/cv.js"></script>
<script src="assets/common.js"></script>
<style>
.stats{display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));border:1px solid var(--line);border-radius:2px;background:var(--panel)}
@media (max-width:760px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stats div{padding:16px 10px;text-align:center;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.stats div:first-child{border-left:0}
@media (max-width:760px){.stats div:nth-child(4){border-left:0}.stats div:nth-child(n+4){border-top:1px solid var(--line)}}
.stats b{font:600 34px/1 var(--display);color:var(--fg);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted);letter-spacing:.02em}
.stats .scholar b{color:var(--accent)}
.asof{font-size:12.5px;color:var(--muted);text-align:right;margin-top:-14px}
.sec{display:flex;flex-direction:column;gap:16px;scroll-margin-top:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--fg);padding-bottom:8px}
.sec-h h2{font:600 clamp(24px,3vw,30px)/1.15 var(--display);letter-spacing:-.015em}
.sec-h .cnt{font:500 15px/1 var(--display);color:var(--accent);letter-spacing:.06em}
.yr{display:grid;grid-template-columns:110px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:640px){.yr{grid-template-columns:minmax(0,1fr);gap:4px}}
.yr>h3{font:600 40px/1 var(--display);color:var(--line);position:sticky;top:16px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .yr>h3{color:#3a3f48}}
:root[data-theme="dark"] .yr>h3{color:#3a3f48}
@media (max-width:640px){.yr>h3{position:static;font-size:30px;color:var(--accent)}}
ol.pubs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ol.pubs li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;padding:16px 0;border-top:1px solid var(--line)}
ol.pubs li:first-child{border-top:0;padding-top:4px}
.no{font:500 15px/1.5 var(--display);color:var(--muted)}
.pt{font-weight:700;font-size:16px;line-height:1.45;margin:0 0 4px;color:var(--fg)}
.pt a{color:inherit;text-decoration:none}
.pt a:hover{text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:4px}
.au{margin:0;font-size:14px;color:var(--muted)}
.au .me{color:var(--fg);font-weight:700;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--gold);text-decoration-thickness:2px}
.jr{margin:2px 0 0;font-size:14px}
.jr i{font-weight:600}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.bd{font:600 11px/1 var(--mono);padding:5px 7px;border-radius:2px;background:var(--sunk);color:var(--muted);text-decoration:none;white-space:nowrap}
.bd.if{background:var(--accent-soft);color:var(--accent)}
a.bd.doi{color:var(--link);border:1px solid var(--line);background:transparent}
a.bd.doi:hover{border-color:var(--link)}
.st{font:600 11px/1 var(--mono);padding:5px 7px;border-radius:2px;white-space:nowrap;align-self:start}
.st.rev{background:var(--warn-soft);color:var(--warn)}
.st.sub{background:var(--sunk);color:var(--muted)}
.st.rv{background:var(--ok-soft);color:var(--ok)}
.st.pat{background:var(--accent-soft);color:var(--accent)}
ol.pubs.ms li{grid-template-columns:34px minmax(0,1fr) auto}
@media (max-width:560px){ol.pubs.ms li{grid-template-columns:34px minmax(0,1fr)} ol.pubs.ms .st{grid-column:2;justify-self:start}}
.note{max-width:80ch}
</style>

<nav class="site-nav" aria-label="사이트 메뉴"><a class="logo" href="index.html">Kyungwon <b>Seo</b></a><ul><li><a href="index.html">Profile</a></li><li><a href="publications.html" aria-current="page">Publications</a></li><li><a href="afm-3d-viewer/">AFM 3D Viewer</a></li></ul></nav>
<header class="page-band">
  <div class="band-inner">
    <h1>Publications</h1>
  </div>
</header>

<div class="wrap" id="app" style="max-width:1040px">
  <section class="stats" id="stats" aria-label="요약"></section>
  <p class="asof" id="asof"></p>

  <section class="sec" id="articles">
    <div class="sec-h"><h2>Journal Articles</h2><span class="cnt" id="n-art"></span></div>
    <div id="years" style="display:flex;flex-direction:column;gap:20px"></div>
  </section>

  <section class="sec" id="manuscripts">
    <div class="sec-h"><h2>Manuscripts</h2><span class="cnt" id="n-ms"></span></div>
    <ol class="pubs ms" id="ms"></ol>
  </section>

  <section class="sec" id="patents">
    <div class="sec-h"><h2>Patents</h2><span class="cnt" id="n-pat"></span></div>
    <ol class="pubs ms" id="pat"></ol>
  </section>

</div>

<script>
(function(){
  const cv = window.KW_CV, esc = KW.esc;
  const me = cv.me;
  const authors = s => esc(s).split(esc(me)).join(`<span class="me">${esc(me)}</span>`);
  const $ = id => document.getElementById(id);
  const P = cv.publications, M = cv.manuscripts || [], T = cv.patents, S = cv.scholar;

  $("stats").innerHTML = [
    [P.length, "Journal articles"], ...(M.length ? [[M.length, "Manuscripts"]] : []), [T.length, "Patents"],
    [S.citations, "Citations", "scholar"], [S.h_index, "h-index", "scholar"], [S.i10_index, "i10-index", "scholar"]
  ].map(([n, l, c]) => `<div class="${c || ""}"><b>${n}</b><span>${l}</span></div>`).join("");
  $("asof").innerHTML = `Citation metrics: <a href="${esc(cv.links[0].href)}" target="_blank" rel="noopener">Google Scholar</a>, ${esc(S.as_of)}`;
  $("n-art").textContent = P.length; $("n-ms").textContent = M.length; $("n-pat").textContent = T.length;
  if (!M.length) $("manuscripts").remove();
  $("stats").style.setProperty("--n", $("stats").children.length);

  let no = P.length;
  const years = [...new Set(P.map(p => p.year))].sort((a, b) => b - a);
  $("years").innerHTML = years.map(y => `<div class="yr"><h3>${y}</h3><ol class="pubs">${
    P.filter(p => p.year === y).map(p => {
      const url = p.doi ? "https://doi.org/" + p.doi : (p.url || "#");
      return `<li><span class="no">${no--}.</span><div>
        <p class="pt"><a href="${esc(url)}" target="_blank" rel="noopener">${p.title}</a></p>
        <p class="au">${authors(p.authors)}</p>
        <p class="jr"><i>${esc(p.journal)}</i>${p.ref ? ", " + esc(p.ref) : ""} (${p.year})</p>
        <div class="badges">${p.if ? `<span class="bd if">IF ${p.if.toFixed(1)}</span>` : ""}${p.cites ? `<span class="bd">Cited ${p.cites}</span>` : ""}
          ${p.doi ? `<a class="bd doi" href="${esc(url)}" target="_blank" rel="noopener">DOI ${esc(p.doi)}</a>` : ""}</div>
      </div></li>`;
    }).join("")}</ol></div>`).join("");

  const cls = s => /review/i.test(s) ? "rev" : /revision/i.test(s) ? "rv" : "sub";
  if (M.length) $("ms").innerHTML = M.map((m, i) => `<li><span class="no">${i + 1}.</span><div>
      <p class="pt">${m.title}</p><p class="au">${authors(m.authors)}</p></div>
      <span class="st ${cls(m.status)}">${esc(m.status)}</span></li>`).join("");
  $("pat").innerHTML = T.map((t, i) => `<li><span class="no">${i + 1}.</span><div>
      <p class="pt">${t.title}</p><p class="au">${authors(t.authors)}</p><p class="jr">${esc(t.ref)}</p></div>
      <span class="st pat">${esc(t.status)}</span></li>`).join("");
})();
</script>

<footer class="site-foot"><span class="mark">Kyungwon Seo</span><span>한양대학교 화학공학과 이미징 기반 소재 지능 연구실</span></footer>

</body>
</html>
