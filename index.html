<script>
/* cover video: plays only while on screen, not at all with reduced motion or data saver;
   the scale bar follows the frame on screen (field width per frame from assets/zoom.js) */
(function(){
  const v = document.getElementById("cover-v"), Z = window.KW_ZOOM;
  if (!v) return;
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches || (navigator.connection && navigator.connection.saveData);
  if (still) { v.removeAttribute("autoplay"); v.preload = "none"; v.pause(); v.poster = "assets/zoom-still.jpg"; }
  const play = () => { if (!still) v.play().catch(() => {}); };
  if ("IntersectionObserver" in window)
    new IntersectionObserver(es => es.forEach(e => e.isIntersecting ? play() : v.pause())).observe(v.parentElement);
  if (!Z) return;
  const box = v.parentElement, zs = document.getElementById("zs"), bar = document.getElementById("zs-b"),
    val = document.getElementById("zs-v"), lab = document.getElementById("zs-l");
  const units = [[1e-3, "mm"], [1e-6, "µm"], [1e-9, "nm"], [1e-10, "Å"]];
  const fmt = m => { for (const [u, n] of units) if (m >= u * 0.999) return `${+(m / u).toPrecision(3)} ${n}`; return `${+(m / 1e-10).toPrecision(2)} Å`; };
  let last = "";
  let mt = 0;                                              // media time of the frame on screen
  function draw(){
    const f = Math.min(Z.z.length - 1, Math.max(0, Math.round(mt * Z.fps)));
    const r = box.getBoundingClientRect(), s = Math.max(r.width / Z.w, r.height / (Z.w * 9 / 16));
    const mpp = Math.pow(10, Z.z[f]) / (Z.w * s);           // metres per CSS pixel at the zoom target
    const want = mpp * 120, b = Math.pow(10, Math.floor(Math.log10(want)));
    const nice = [5 * b, 2 * b, b].find(x => x <= want);    // 1, 2 or 5 x 10^n: bar 48-120 px
    bar.style.width = (nice / mpp).toFixed(1) + "px";
    const t = fmt(nice) + "|" + Z.labels[Z.lab[f]];
    if (t !== last) { last = t; val.textContent = fmt(nice); lab.textContent = Z.labels[Z.lab[f]]; }
  }
  zs.hidden = false;
  draw();
  if ("requestVideoFrameCallback" in v) {                  // follow the frame actually painted, not currentTime
    const onFrame = (now, meta) => { mt = meta.mediaTime; draw(); v.requestVideoFrameCallback(onFrame); };
    v.requestVideoFrameCallback(onFrame);
  } else {
    (function loop(){ if (!v.paused && !document.hidden) { mt = v.currentTime; draw(); } requestAnimationFrame(loop); })();
  }
  addEventListener("resize", draw);
})();
</script>
